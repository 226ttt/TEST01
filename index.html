<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cosmic Star System</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; display: block; }
        #ui-layer { position: absolute; bottom: 20px; left: 20px; color: rgba(255, 255, 255, 0.7); z-index: 2; pointer-events: none; }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
        p { margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.8; }

        /* เลเยอร์สำหรับข้อความดาว */
        #labels-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; overflow: hidden; }
        .star-label { position: absolute; color: white; background: rgba(255, 255, 255, 0.15); padding: 4px 10px; border-radius: 6px; font-size: 14px; transform: translate(-50%, -100%); pointer-events: auto; border: 1px solid rgba(255, 255, 255, 0.4); white-space: nowrap; backdrop-filter: blur(4px); text-shadow: 0 1px 3px rgba(0,0,0,0.8); cursor: pointer; transition: background 0.2s; }
        .star-label:hover { background: rgba(255, 255, 255, 0.3); }
        
        /* กล่องสำหรับพิมพ์ข้อความ */
        .input-box { position: absolute; background: rgba(0, 0, 0, 0.9); border: 1px solid #66b3ff; padding: 10px; border-radius: 8px; z-index: 20; transform: translate(-50%, -110%); pointer-events: auto; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .input-box input, .input-box textarea { background: #222; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; font-family: inherit; outline: none; user-select: text; pointer-events: auto; }
        .input-box input:focus, .input-box textarea:focus { border-color: #66b3ff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h1>Cosmic Core</h1>
        <p>คลิกซ้ายลาก: หมุน | คลิกขวาลาก หรือ W,A,S,D: เลื่อนตำแหน่ง | ลูกกลิ้ง: ซูมพุ่งหาเมาส์อย่างอิสระ</p>
    </div>
    
    <div id="canvas-container"></div>
    <div id="labels-container"></div>

    <script>
        let scene, camera, renderer, controls, starSystem;
        let raycaster = new THREE.Raycaster();
        raycaster.params.Points.threshold = 15; 
        let mouse = new THREE.Vector2();
        let labels = {}; 
        let activeInput = null;

        let moveState = { up: 0, down: 0, left: 0, right: 0 };
        
        // ตัวแปรสำหรับระบบการซูมพุ่งหาเมาส์แบบสมูท
        let targetZoomSpeed = 0;
        let currentZoomSpeed = 0;

        function init() {
            scene = new THREE.Scene();
            // ขยายระยะการมองเห็นของกล้องเพื่อรองรับกาแล็กซีที่กว้างใหญ่ขึ้น
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 60000);
            camera.position.set(0, 300, 800);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // ใช้ TrackballControls เฉพาะตอนหมุน (Rotate) และเลื่อน (Pan)
            controls = new THREE.TrackballControls(camera, renderer.domElement);
            controls.rotateSpeed = 4.0;        
            controls.panSpeed = 5.0;           
            controls.noZoom = true;            // ปิดระบบซูมดั้งเดิมที่วิ่งเข้าหาศูนย์กลาง
            controls.staticMoving = false;     
            controls.dynamicDampingFactor = 0.08; 
            
            createStarSystem();
            
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousedown', onPointerDown, false); 
            document.addEventListener('contextmenu', e => e.preventDefault()); 
            
            window.addEventListener('keydown', (e) => {
                if (activeInput) return; 
                const key = e.key.toLowerCase();
                if (key === 'w' || key === 'arrowup') moveState.up = 1;
                if (key === 's' || key === 'arrowdown') moveState.down = 1;
                if (key === 'a' || key === 'arrowleft') moveState.left = 1;
                if (key === 'd' || key === 'arrowright') moveState.right = 1;
            });
            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w' || key === 'arrowup') moveState.up = 0;
                if (key === 's' || key === 'arrowdown') moveState.down = 0;
                if (key === 'a' || key === 'arrowleft') moveState.left = 0;
                if (key === 'd' || key === 'arrowright') moveState.right = 0;
            });

            // อัปเดตตำแหน่งเมาส์ตลอดเวลาเพื่อใช้เป็นพิกัดเป้าหมายในการพุ่ง
            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            // ตรวจจับลูกกลิ้งเมาส์ เพื่อสะสมความเร็วในการพุ่ง
            window.addEventListener('wheel', (e) => {
                if (activeInput) return;
                // เก็บสะสมความเร็ว (เลื่อนขึ้นติดลบ = พุ่งไปข้างหน้า)
                targetZoomSpeed -= e.deltaY * 0.02; 
            }, { passive: false });
            
            animate();
        }

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');      
            gradient.addColorStop(0.15, 'rgba(255, 255, 255, 1)');   
            gradient.addColorStop(0.25, 'rgba(255, 255, 255, 0.4)'); 
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');  
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');            
            context.fillStyle = gradient;
            context.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function createStarSystem() {
            // เพิ่มจำนวนดาวจาก 50,000 เป็น 1,000,000 ดวง (1 ล้านดวง)
            const particleCount = 1000000; 
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);

            const colorPalette = [
                new THREE.Color(0x9bb0ff), 
                new THREE.Color(0xaabfff), 
                new THREE.Color(0xcad7ff), 
                new THREE.Color(0xf8f7ff), 
                new THREE.Color(0xfff4ea), 
                new THREE.Color(0xffd2a1), 
                new THREE.Color(0xffcc6f)  
            ];

            for (let i = 0; i < particleCount; i++) {
                // ขยายการกระจายตัวของดาวเพิ่มขึ้นอีก 100% (รัศมีจาก 4500 เป็น 9000)
                const radius = Math.cbrt(Math.random()) * 9000; 
                const u = Math.random();
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);

                let colorBase;
                const randColor = Math.random();
                if (randColor > 0.99) colorBase = colorPalette[0];      
                else if (randColor > 0.95) colorBase = colorPalette[1]; 
                else if (randColor > 0.85) colorBase = colorPalette[2]; 
                else if (randColor > 0.70) colorBase = colorPalette[3]; 
                else if (randColor > 0.50) colorBase = colorPalette[4]; 
                else if (randColor > 0.25) colorBase = colorPalette[5]; 
                else colorBase = colorPalette[6];                       

                let color = colorBase.clone();
                color.lerp(new THREE.Color(0xffffff), Math.random() * 0.1);

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                // ขยายขนาดดาวเพิ่มขึ้นอีก 100% (จากคูณ 3.5 เป็น 7.0)
                sizes[i] = (Math.random() * 2 + 0.5) * 7.0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTexture: { value: createGlowTexture() }
                },
                vertexShader: `
                    attribute float size;
                    attribute vec3 color;
                    varying vec3 vColor;
                    void main() {
                        vColor = color;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        // ย้อนกลับมาใช้ระบบคำนวณขนาดตามระยะห่าง (Depth effect)
                        gl_PointSize = max(1.5, size * (1000.0 / -mvPosition.z));
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uTexture;
                    varying vec3 vColor;
                    void main() {
                        vec4 texColor = texture2D(uTexture, gl_PointCoord);
                        gl_FragColor = vec4(vColor, 1.0) * texColor;
                    }
                `,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true
            });

            starSystem = new THREE.Points(geometry, material);
            scene.add(starSystem);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            controls.handleResize();
        }

        function onPointerDown(e) {
            if(activeInput || e.target.tagName !== 'CANVAS') return;
            if(e.button !== 0) return;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(starSystem);
            
            if (intersects.length > 0) {
                showInput(intersects[0].index, e.clientX, e.clientY);
            }
        }

        function showInput(index, x, y) {
            controls.enabled = false;

            const box = document.createElement('div');
            box.className = 'input-box';
            box.style.left = x + 'px'; box.style.top = y + 'px';
            
            const titleInput = document.createElement('input');
            titleInput.placeholder = "หัวข้อ";
            titleInput.value = labels[index] ? labels[index].title : "";
            
            const descInput = document.createElement('textarea');
            descInput.placeholder = "เนื้อเรื่อง (ไม่แสดงบนจอ)";
            descInput.value = labels[index] ? labels[index].desc : "";
            
            box.appendChild(titleInput);
            box.appendChild(descInput);
            document.body.appendChild(box);
            activeInput = box;

            const save = () => {
                if (titleInput.value.trim()) {
                    if (labels[index]) labels[index].element.remove();
                    
                    const label = document.createElement('div');
                    label.className = 'star-label';
                    label.innerText = titleInput.value;
                    
                    label.onmousedown = (ev) => {
                        ev.stopPropagation(); 
                        showInput(index, parseInt(label.style.left), parseInt(label.style.top));
                    };

                    document.getElementById('labels-container').appendChild(label);
                    labels[index] = { title: titleInput.value, desc: descInput.value, element: label };
                }
                box.remove();
                activeInput = null;
                
                controls.enabled = true;
            };

            setTimeout(() => {
                document.addEventListener('mousedown', function outsideClick(e) {
                    if(!box.contains(e.target)) {
                        save();
                        document.removeEventListener('mousedown', outsideClick);
                    }
                });
            }, 10);
            
            titleInput.focus();
        }

        function updateLabels() {
            if (!starSystem) return;
            const pos = starSystem.geometry.attributes.position;
            const vec = new THREE.Vector3();
            for (let i in labels) {
                vec.fromBufferAttribute(pos, i).applyMatrix4(starSystem.matrixWorld).project(camera);
                if (vec.z > 1) {
                    labels[i].element.style.display = 'none'; 
                } else {
                    labels[i].element.style.display = 'block';
                    labels[i].element.style.left = ((vec.x * 0.5 + 0.5) * window.innerWidth) + 'px';
                    labels[i].element.style.top = ((-(vec.y * 0.5 - 0.5) * window.innerHeight) - 15) + 'px';
                    labels[i].element.style.zIndex = Math.floor((1 - vec.z) * 1000);
                }
            }
        }

        function handleKeyboardPan() {
            if(activeInput) return;
            if(moveState.up === 0 && moveState.down === 0 && moveState.left === 0 && moveState.right === 0) return;

            const distance = camera.position.distanceTo(controls.target);
            const speed = distance * 0.015; 

            const panX = (moveState.right - moveState.left) * speed;
            const panY = (moveState.up - moveState.down) * speed;

            const vX = new THREE.Vector3();
            const vY = new THREE.Vector3();
            vX.setFromMatrixColumn(camera.matrix, 0).multiplyScalar(panX);
            vY.setFromMatrixColumn(camera.matrix, 1).multiplyScalar(panY);

            camera.position.add(vX).add(vY);
            controls.target.add(vX).add(vY);
        }

        // ฟังก์ชันจัดการฟิสิกส์การพุ่งหาเมาส์ที่สมูท
        function handleFlyZoom() {
            // คำนวณแรงเฉื่อย ค่อยๆ ลดความเร็วเมื่อหยุดหมุนลูกกลิ้ง
            currentZoomSpeed += (targetZoomSpeed - currentZoomSpeed) * 0.1;
            targetZoomSpeed *= 0.85; // เบรกอย่างนุ่มนวล

            if (Math.abs(currentZoomSpeed) > 0.01) {
                // คำนวณเวกเตอร์ 3D ชี้จากกล้องไปหาตำแหน่งที่เมาส์อยู่บนหน้าจอ
                const dir = new THREE.Vector3(mouse.x, mouse.y, 0.5).unproject(camera).sub(camera.position).normalize();
                
                // กำหนดความเร็วในการพุ่ง
                const speed = currentZoomSpeed * 15.0;

                // ขยับทั้งตัวกล้อง และ จุดที่กล้องมอง (target) ไปพร้อมๆ กัน
                camera.position.addScaledVector(dir, speed);
                controls.target.addScaledVector(dir, speed);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (!activeInput && starSystem) {
                starSystem.rotation.y -= 0.0008; 
            }
            
            handleKeyboardPan();
            handleFlyZoom(); // ใช้งานการซูมแบบพุ่งหาเมาส์
            
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>

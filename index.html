<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Spiritual Portal</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            user-select: none;
        }
        #info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 100;
        }
        canvas {
            display: block;
        }
        #oracle-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(10, 5, 25, 0.7);
            border: 1px solid rgba(255, 184, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            color: white;
            z-index: 101;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        #oracle-ui h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #FFB800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #oracle-input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-family: inherit;
        }
        #oracle-input:focus {
            outline: none;
            border-color: #3B008A;
            box-shadow: 0 0 8px rgba(59, 0, 138, 0.8);
        }
        #oracle-btn {
            width: 100%;
            background: linear-gradient(45deg, #3B008A, #FFB800);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }
        #oracle-btn:hover {
            opacity: 0.8;
        }
        #oracle-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #oracle-response {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.9);
            font-style: italic;
            min-height: 20px;
        }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Drag to Warp Space &bull; Scroll to Zoom</div>
    
    <div id="oracle-ui">
        <h2>The Cosmic Oracle</h2>
        <input type="text" id="oracle-input" placeholder="Seek wisdom from the void..." autocomplete="off">
        <button id="oracle-btn">Consult the Void ✨</button>
        <div id="oracle-response"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050015, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.maxDistance = 60;
        controls.minDistance = 10;
        // Dampen standard rotation to let the drag warp effect shine
        controls.rotateSpeed = 0.4; 

        // --- Particles (The Vortex) ---
        const particleCount = 50000;
        const geometry = new THREE.BufferGeometry();
        
        const positions = new Float32Array(particleCount * 3);
        const randoms = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            
            // Create an accretion disk / funnel shape
            const radius = Math.pow(Math.random(), 2.5) * 25; 
            const angle = Math.random() * Math.PI * 2;
            
            // Height concentrated at center, spreading out slightly
            const heightVariance = (Math.random() - 0.5) * 2.0;
            // Creates the "funnel" dipping in the middle
            const y = (Math.random() > 0.5 ? 1 : -1) * (1.0 / (radius + 0.5)) * 5.0 + heightVariance;

            positions[i3] = Math.cos(angle) * radius;
            positions[i3 + 1] = y;
            positions[i3 + 2] = Math.sin(angle) * radius;

            // Random values for animation phase and size
            randoms[i3] = Math.random();
            randoms[i3 + 1] = Math.random();
            randoms[i3 + 2] = Math.random();
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));

        // Custom Shader Material for particles
        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uWarp: { value: new THREE.Vector2(0, 0) },
                uColorViolet: { value: new THREE.Color(0x3B008A) }, // Deep Violet
                uColorGold: { value: new THREE.Color(0xFFB800) },   // Neon Gold
                uColorWhite: { value: new THREE.Color(0xFFFFFF) },  // Pure White
            },
            vertexShader: `
                uniform float uTime;
                uniform vec2 uWarp;
                attribute vec3 aRandom;

                varying vec3 vPosition;
                varying float vRadius;

                void main() {
                    vec3 pos = position;
                    
                    // Cylindrical coordinates for vortex math
                    float radius = length(pos.xz);
                    float angle = atan(pos.z, pos.x);

                    // Cosmic rotation (faster near center)
                    float rotSpeed = uTime * (2.0 / (radius + 1.0));
                    angle += rotSpeed;

                    // Dynamic Warp based on mouse drag
                    float warpIntensity = length(uWarp);
                    if (warpIntensity > 0.0) {
                        // Twist space around the Y axis based on drag magnitude and distance from center
                        float falloff = exp(-radius * 0.15); // Warp affects center mostly
                        
                        // Twist angle
                        angle += uWarp.x * falloff * 5.0;
                        
                        // Vertical displacement
                        pos.y += uWarp.y * falloff * 10.0 * sin(uTime + radius);
                        
                        // Gravitational pull towards center during heavy warp
                        radius -= warpIntensity * falloff * 2.0 * aRandom.y;
                    }

                    // Convert back to Cartesian
                    pos.x = cos(angle) * radius;
                    pos.z = sin(angle) * radius;

                    // Organic undulating movement
                    pos.y += sin(uTime * 2.0 + radius * 0.5 + aRandom.z * 6.28) * 0.5 * (1.0 - exp(-radius*0.1));

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;

                    // Size attenuation
                    float baseSize = 8.0 * aRandom.x + 4.0;
                    gl_PointSize = baseSize * (25.0 / -mvPosition.z);

                    vPosition = pos;
                    vRadius = radius;
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uColorViolet;
                uniform vec3 uColorGold;
                uniform vec3 uColorWhite;

                varying vec3 vPosition;
                varying float vRadius;

                void main() {
                    // Create soft circular particles
                    vec2 coord = gl_PointCoord - vec2(0.5);
                    float dist = length(coord);
                    if (dist > 0.5) discard;
                    
                    // Soft gradient edge
                    float alpha = smoothstep(0.5, 0.1, dist);

                    // Color mixing based on distance from core
                    vec3 color = uColorViolet;
                    
                    // Mid section: Gold
                    float mixGold = smoothstep(12.0, 3.0, vRadius);
                    color = mix(color, uColorGold, mixGold);

                    // Core: White hot
                    float mixWhite = smoothstep(2.0, 0.0, vRadius);
                    color = mix(color, uColorWhite, mixWhite);

                    // Twinkling effect
                    alpha *= 0.5 + 0.5 * sin(uTime * 5.0 + vPosition.x * 10.0);

                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });

        const particleSystem = new THREE.Points(geometry, particleMaterial);
        scene.add(particleSystem);

        // --- Volumetric Light Rays (Central Beam) ---
        const beamGeometry = new THREE.CylinderGeometry(0.1, 4.0, 40, 32, 1, true);
        const beamMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;
                void main() {
                    // Fade out at top and bottom
                    float alphaY = smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.7, vUv.y);
                    
                    // Fade out at edges to simulate cylindrical volume
                    float centerDist = abs(vUv.x - 0.5) * 2.0;
                    float alphaX = smoothstep(1.0, 0.0, centerDist);

                    // Pulsing light simulation
                    float pulse = 0.5 + 0.5 * sin(uTime * 3.0 - vUv.y * 10.0);
                    
                    // Ray striations/noise
                    float noise = sin(vUv.x * 50.0 + uTime) * 0.1 + 0.9;

                    float alpha = alphaX * alphaY * pulse * noise * 0.4;
                    
                    // Ethereal white/gold tint
                    vec3 color = mix(vec3(1.0, 1.0, 1.0), vec3(1.0, 0.8, 0.4), centerDist);

                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        const beam = new THREE.Mesh(beamGeometry, beamMaterial);
        scene.add(beam);

        // --- Post-Processing Pipeline ---
        const renderScene = new RenderPass(scene, camera);

        // Bloom for glowing particles and rays
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 1.8; // High strength for cinematic glow
        bloomPass.radius = 0.5;

        // Cinematic Depth of Field (Bokeh)
        const bokehPass = new BokehPass(scene, camera, {
            focus: 38.0,      // Focal distance (camera to center approx)
            aperture: 0.0002, // Lens aperture
            maxblur: 0.015,   // Blur strength
            width: window.innerWidth,
            height: window.innerHeight
        });

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);
        composer.addPass(bokehPass);

        // --- Interaction Logic (Mouse Drag Warping) ---
        let isDragging = false;
        const targetWarp = new THREE.Vector2(0, 0);
        const currentWarp = new THREE.Vector2(0, 0);

        window.addEventListener('mousedown', () => { isDragging = true; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mouseleave', () => { isDragging = false; });

        window.addEventListener('mousemove', (event) => {
            if (isDragging) {
                // Accumulate drag delta
                targetWarp.x += event.movementX * 0.002;
                targetWarp.y -= event.movementY * 0.002; // Invert Y
            }
        });

        // Handle Touch for Mobile
        let lastTouch = null;
        window.addEventListener('touchstart', (e) => { 
            isDragging = true; 
            lastTouch = e.touches[0];
        }, {passive: false});
        
        window.addEventListener('touchend', () => { 
            isDragging = false; 
            lastTouch = null;
        });
        
        window.addEventListener('touchmove', (e) => {
            if (isDragging && lastTouch) {
                const touch = e.touches[0];
                targetWarp.x += (touch.clientX - lastTouch.clientX) * 0.003;
                targetWarp.y -= (touch.clientY - lastTouch.clientY) * 0.003;
                lastTouch = touch;
            }
        }, {passive: false});

        // --- Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            // Update DoF aspect
            bokehPass.uniforms['aspect'].value = camera.aspect;
        });

        // --- Gemini API Oracle Integration ---
        const apiKey = ""; // Provided by execution environment
        const oracleBtn = document.getElementById('oracle-btn');
        const oracleInput = document.getElementById('oracle-input');
        const oracleResponse = document.getElementById('oracle-response');
        
        let isOracleThinking = false;
        let portalCoreTargetColor = new THREE.Color(0xFFFFFF); // Default pure white

        async function fetchWithRetry(url, options, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        async function consultOracle() {
            const query = oracleInput.value.trim();
            if (!query) return;

            // Update UI State & Trigger Visuals
            isOracleThinking = true;
            oracleBtn.disabled = true;
            oracleInput.disabled = true;
            oracleResponse.innerText = "The void is listening...";
            portalCoreTargetColor.setHex(0xFF0055); // Shift core to a neon pink/red warning hue

            try {
                // System Instruction to give the portal a specific, thematic personality
                const systemPrompt = "You are the ancient intelligence residing within a Sci-Fi Spiritual Portal. A traveler approaches you seeking cosmic wisdom. Reply to their thought or question with a deeply profound, cryptic, and mystical answer. Keep it very brief, exactly 2 to 3 sentences. Speak as the cosmos itself.";
                
                const payload = {
                    contents: [{ parts: [{ text: query }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const result = await fetchWithRetry(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }
                );

                const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "The cosmos is currently unreachable. Try again.";
                
                // Typewriter effect for displaying the response
                oracleResponse.innerText = "";
                let i = 0;
                const typeInterval = setInterval(() => {
                    oracleResponse.innerText += text.charAt(i);
                    i++;
                    if (i >= text.length) clearInterval(typeInterval);
                }, 40);

            } catch (error) {
                console.error("Oracle Error:", error);
                oracleResponse.innerText = "A temporal anomaly disrupted the connection. Please try again.";
            } finally {
                // Reset State
                isOracleThinking = false;
                oracleBtn.disabled = false;
                oracleInput.disabled = false;
                oracleInput.value = "";
                portalCoreTargetColor.setHex(0xFFFFFF); // Return core to pure white
            }
        }

        oracleBtn.addEventListener('click', consultOracle);
        oracleInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') consultOracle();
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            
            controls.update();

            // Calculate distance to center to adjust Depth of Field focus dynamically based on camera position
            const distanceToCenter = camera.position.length();
            bokehPass.uniforms['focus'].value = distanceToCenter;

            // Physics/Lerp for the Warp Effect
            if (!isDragging) {
                // Slowly decay target warp back to normal
                targetWarp.lerp(new THREE.Vector2(0, 0), 0.03);
            }
            
            // Limit maximum warp to prevent visual breakdown
            targetWarp.x = THREE.MathUtils.clamp(targetWarp.x, -2.0, 2.0);
            targetWarp.y = THREE.MathUtils.clamp(targetWarp.y, -2.0, 2.0);

            // Smoothly interpolate current warp towards target warp
            currentWarp.lerp(targetWarp, 0.1);

            // Oracle Visual Feedback (Color and Bloom shifting based on API state)
            particleMaterial.uniforms.uColorWhite.value.lerp(portalCoreTargetColor, 0.03);
            const targetBloom = isOracleThinking ? 3.0 + Math.sin(time * 10.0) * 1.0 : 1.8;
            bloomPass.strength = THREE.MathUtils.lerp(bloomPass.strength, targetBloom, 0.05);

            // Update Shader Uniforms
            particleMaterial.uniforms.uTime.value = time;
            particleMaterial.uniforms.uWarp.value.copy(currentWarp);
            beamMaterial.uniforms.uTime.value = time;

            // Render via composer for post-processing effects
            composer.render();
        }

        animate();
    </script>
</body>
</html>

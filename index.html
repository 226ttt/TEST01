<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cosmic Star System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            z-index: 2;
            pointer-events: none;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* --- เพิ่ม CSS สำหรับระบบป้ายข้อความ --- */
        #labels-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; /* ให้คลิกทะลุไปโดน Canvas ด้านล่างได้ */
            z-index: 10;
            overflow: hidden;
        }
        .star-label {
            position: absolute;
            color: white;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            transform: translate(-50%, -100%);
            pointer-events: auto; /* ให้คลิกที่ข้อความเพื่อแก้ไขภายหลังได้ */
            border: 1px solid rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            backdrop-filter: blur(4px);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .star-input {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #66b3ff;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            pointer-events: auto;
            outline: none;
            z-index: 20;
            transform: translate(-50%, -100%);
        }
        /* ---------------------------------- */
    </style>
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- เปลี่ยนจาก OrbitControls เป็น TrackballControls เพื่อให้หมุนตีลังกาได้ -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h1>Cosmic Core</h1>
        <p>Drag to rotate | Scroll to zoom</p>
    </div>
    
    <div id="canvas-container"></div>
    <div id="labels-container"></div> <!-- คอนเทนเนอร์สำหรับใส่ข้อความ -->

    <script>
        // Main initialization
        let scene, camera, renderer, controls;
        let starSystem, sunGlows = [];
        let time = 0;

        // --- เพิ่มตัวแปรสำหรับระบบคลิกและพิมพ์ข้อความ ---
        let raycaster = new THREE.Raycaster();
        raycaster.params.Points.threshold = 10; // รัศมีความแม่นยำในการคลิกโดนดาว (ยิ่งมากยิ่งคลิกติดง่าย)
        let mouse = new THREE.Vector2();
        let labels = {}; // Object เก็บข้อมูลข้อความของดาวแต่ละดวง
        let activeInput = null;
        let pointerDownPos = {x: 0, y: 0};
        // -----------------------------------------

        window.onload = function() {
            init();
            animate();
        };

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0005);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 300, 800);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Enhanced rendering for glows
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. TrackballControls Setup (หมุนอิสระแบบไร้แรงโน้มถ่วง)
            controls = new THREE.TrackballControls(camera, renderer.domElement);
            controls.rotateSpeed = 2.5;
            controls.zoomSpeed = 1.2;
            controls.panSpeed = 0.8;
            controls.staticMoving = false; // ปิด static เพื่อให้มีการหน่วงแบบสมูท
            controls.dynamicDampingFactor = 0.05;
            controls.minDistance = 50;
            controls.maxDistance = 2000;

            // 5. Create Star System (50,000 particles)
            createStarSystem();

            // 6. Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            
            // --- เพิ่ม Event Listeners สำหรับจับการคลิกดวงดาว ---
            window.addEventListener('pointerdown', (e) => {
                pointerDownPos = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('pointerup', (e) => {
                // คำนวณระยะห่างระหว่างจุดกดกับจุดปล่อย เพื่อแยกระหว่างการ "คลิก" กับการ "ลากหมุนจอ"
                const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                if (dist < 5) handleStarClick(e);
            });
            // ---------------------------------------------
        }

        // Generate a soft circular gradient texture for particles using HTML5 Canvas
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const context = canvas.getContext('2d');
            
            const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
            // ปรับไล่สีใหม่ ให้แกนกลางดาวมีความคมชัด (ทึบแสง) และเรืองแสงที่ขอบ
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');      // จุดศูนย์กลางสว่างสุด
            gradient.addColorStop(0.15, 'rgba(255, 255, 255, 1)');   // แกนกลางทึบคมชัด (ขยายขนาดแกน)
            gradient.addColorStop(0.25, 'rgba(255, 255, 255, 0.4)'); // ขอบแกนกลาง
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');  // แสงฟุ้งกระจาย
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');            // จางหายไป

            context.fillStyle = gradient;
            context.fillRect(0, 0, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function createStarSystem() {
            const particleCount = 50000;
            const geometry = new THREE.BufferGeometry();
            
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);

            // ค่าสีของดวงดาวตามหลักสเปกตรัมจริง (O, B, A, F, G, K, M)
            const colorPalette = [
                new THREE.Color(0x9bb0ff), // O: น้ำเงิน (ร้อนสุด พบน้อย)
                new THREE.Color(0xaabfff), // B: ขาวอมฟ้า
                new THREE.Color(0xcad7ff), // A: ขาว
                new THREE.Color(0xf8f7ff), // F: ขาวอมเหลือง
                new THREE.Color(0xfff4ea), // G: เหลือง (แบบดวงอาทิตย์ของเรา)
                new THREE.Color(0xffd2a1), // K: ส้ม
                new THREE.Color(0xffcc6f)  // M: แดงส้ม (เย็นสุด พบเยอะสุดในจักรวาล)
            ];

            for (let i = 0; i < particleCount; i++) {
                // Determine position using a spherical distribution (360 degrees)
                // ปรับให้ดวงดาวกระจายตัวอย่างสม่ำเสมอทั่วพื้นที่ทรงกลม (Uniform Volume Distribution)
                const radius = Math.cbrt(Math.random()) * 1500; 
                
                // Spherical coordinates for even distribution
                const u = Math.random();
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);

                // สุ่มสีให้สมจริง (อิงตามความน่าจะเป็นของการพบดาวแต่ละชนิดในจักรวาล)
                let colorBase;
                const randColor = Math.random();
                if (randColor > 0.99) colorBase = colorPalette[0];      // 1% น้ำเงิน
                else if (randColor > 0.95) colorBase = colorPalette[1]; // 4% ขาวอมฟ้า
                else if (randColor > 0.85) colorBase = colorPalette[2]; // 10% ขาว
                else if (randColor > 0.70) colorBase = colorPalette[3]; // 15% ขาวอมเหลือง
                else if (randColor > 0.50) colorBase = colorPalette[4]; // 20% เหลือง
                else if (randColor > 0.25) colorBase = colorPalette[5]; // 25% ส้ม
                else colorBase = colorPalette[6];                       // 25% แดงส้ม

                // โคลนสีเพื่อไม่ให้กระทบพาเลตต์ต้นฉบับ และเพิ่มความแปรปรวนของสีเล็กน้อย
                let color = colorBase.clone();
                color.lerp(new THREE.Color(0xffffff), Math.random() * 0.1);

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                // Size variation (เพิ่มขนาดขึ้นอีก 100% โดยคูณ 6.0)
                sizes[i] = (Math.random() * 2 + 0.5) * 6.0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            // Custom Shader Material to handle varying sizes and soft texture
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uTexture: { value: createGlowTexture() }
                },
                vertexShader: `
                    attribute float size;
                    attribute vec3 color;
                    varying vec3 vColor;
                    void main() {
                        vColor = color;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        // Depth effect on size
                        gl_PointSize = size * (1000.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uTexture;
                    varying vec3 vColor;
                    void main() {
                        vec4 texColor = texture2D(uTexture, gl_PointCoord);
                        gl_FragColor = vec4(vColor, 1.0) * texColor;
                    }
                `,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true
            });

            starSystem = new THREE.Points(geometry, material);
            scene.add(starSystem);
            
            // Add a subtle inclination to the system
            starSystem.rotation.x = 0.1;
            starSystem.rotation.z = -0.05;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            controls.handleResize(); // จำเป็นต้องอัปเดตเมื่อใช้ TrackballControls
        }

        // --- เพิ่มฟังก์ชันจัดการการคลิก สร้างกล่องพิมพ์ และอัปเดตตำแหน่งข้อความ ---
        function handleStarClick(event) {
            if (activeInput) return; // หากกำลังพิมพ์อยู่ให้ข้ามการคลิกใหม่ไปก่อน

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            // ตรวจสอบว่าคลิกโดนดาวดวงไหนบ้าง
            const intersects = raycaster.intersectObject(starSystem);

            if (intersects.length > 0) {
                // เอาดาวดวงที่อยู่ใกล้ที่สุด (ดวงแรกใน array)
                const index = intersects[0].index;
                showInputForStar(index, event.clientX, event.clientY);
            }
        }

        function showInputForStar(index, clientX, clientY) {
            const container = document.getElementById('labels-container');
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'star-input';
            input.style.left = clientX + 'px';
            input.style.top = clientY + 'px';
            input.placeholder = 'ตั้งชื่อดวงดาว...';
            
            // หากดวงดาวนี้มีชื่ออยู่แล้ว ให้ลบป้ายเดิมแล้วเอาข้อความมาใส่กล่อง input (เพื่อแก้ไข)
            if (labels[index]) {
                input.value = labels[index].text;
                labels[index].element.remove();
                delete labels[index];
            }

            container.appendChild(input);
            input.focus();
            activeInput = input;

            // ฟังก์ชันจบการพิมพ์
            const finishEdit = () => {
                if (input.value.trim() !== "") saveLabel(index, input.value);
                if (input.parentNode) input.remove();
                activeInput = null;
            };

            // บันทึกเมื่อกด Enter หรือคลิกพื้นที่อื่น
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finishEdit(); });
            input.addEventListener('blur', finishEdit);
        }

        function saveLabel(index, text) {
            const container = document.getElementById('labels-container');
            const labelDiv = document.createElement('div');
            labelDiv.className = 'star-label';
            labelDiv.innerText = text;
            container.appendChild(labelDiv);

            // บันทึกข้อมูลป้ายพร้อม index ของดวงดาว เพื่อใช้อัปเดตตำแหน่ง
            labels[index] = { text: text, element: labelDiv };
        }

        function updateLabels() {
            if (!starSystem) return;
            const positions = starSystem.geometry.attributes.position;
            const tempVector = new THREE.Vector3();

            for (const index in labels) {
                const label = labels[index];
                
                // ดึงพิกัด 3D เดิมของดวงดาว
                tempVector.fromBufferAttribute(positions, index);
                // นำไปคูณกับเมทริกซ์การหมุนของกาแล็กซีปัจจุบัน
                tempVector.applyMatrix4(starSystem.matrixWorld);
                // โพรเจกต์พิกัด 3D แปลงเป็นพิกัดหน้าจอ (Screen Space)
                tempVector.project(camera);

                // ซ่อนข้อความหากดาวหลุดไปอยู่หลังกล้อง
                if (tempVector.z > 1) {
                    label.element.style.display = 'none';
                } else {
                    label.element.style.display = 'block';
                    const x = (tempVector.x * 0.5 + 0.5) * window.innerWidth;
                    const y = -(tempVector.y * 0.5 - 0.5) * window.innerHeight;
                    label.element.style.left = x + 'px';
                    label.element.style.top = (y - 15) + 'px'; // ให้ป้ายลอยอยู่เหนือดาวเล็กน้อย
                    // ปรับ z-index ให้ข้อความที่อยู่ใกล้บังข้อความที่อยู่ไกล
                    label.element.style.zIndex = Math.floor((1 - tempVector.z) * 1000);
                }
            }
        }
        // ------------------------------------------------------------------

        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01;

            // 1. Slow cosmic rotation of the star system
            // หยุดหมุนกาแล็กซีเมื่อกำลังพิมพ์ข้อความ (activeInput มีค่า)
            if (starSystem && !activeInput) {
                starSystem.rotation.y -= 0.0008; // Rotate entire galaxy
            }

            // 2. Update Controls for smooth dragging
            controls.update();

            // 3. อัปเดตตำแหน่งป้ายข้อความให้ลอยตามดวงดาวแบบ Real-time
            updateLabels();

            // 4. Render Scene
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
